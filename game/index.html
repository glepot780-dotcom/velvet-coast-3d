<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Azure Tide — Meridian Bay</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #14101f; }
  #gl, #hud { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { z-index: 2; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="gl" aria-label="Azure Tide: a 3D open-world crime game in Meridian Bay"></canvas>
<canvas id="hud" aria-hidden="true"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
